<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="theme-color"
      content="#f5e6ac"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#24261d"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="人々が抱える、永遠と思えるような難しい課題を、少しずつテクノロジーで解決できるように。暮らしを少し豊かに、便利にしていくためのものづくりを。"
    />
    <title>TowaPC</title>

    <script src="/theme-bootstrap.js?v=73"></script>
    <link rel="stylesheet" href="/styles/foundation.css?v=73" />
    <link rel="stylesheet" href="/styles/home.css?v=73" />
    <link rel="stylesheet" href="/styles/content.css?v=73" />
    <link rel="stylesheet" href="/styles/footer.css?v=73" />
    <link rel="stylesheet" href="/styles/responsive.css?v=73" />
    <link rel="stylesheet" href="/styles/dark-motion.css?v=73" />
    <link rel="stylesheet" href="/styles/legal-cookie.css?v=73" />
    <link rel="stylesheet" href="/styles/appearance-lab.css?v=73" />
    <link rel="stylesheet" href="/styles/ui-polish.css?v=73" />
    <link rel="stylesheet" href="/styles/material-theme.css?v=73" />
    <link rel="stylesheet" href="/styles/features.css?v=73" />
    <link rel="stylesheet" href="/styles/shadowless-theme.css?v=73" />
    <link rel="stylesheet" href="/styles/monochrome-theme.css?v=73" />
    <link rel="stylesheet" href="/styles/easter-eggs.css?v=73" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link
      rel="preload"
      href="/assets/TowaPC.svg"
      as="image"
      type="image/svg+xml"
    />
    <script src="/analytics.js?v=73"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="/" aria-label="TowaPC ホーム">
        <img
          class="custom-logo"
          src="/assets/TowaPC.svg"
          alt="TowaPC"
          width="485"
          height="100"
          fetchpriority="high"
        />
      </a>
      <button
        class="menu-button"
        aria-label="メニューを開く"
        aria-expanded="false"
      >
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
      </button>
      <nav aria-label="メインナビゲーション"></nav>
    </header>

    <main id="main"></main>

    <footer>
      <div class="footer-brand">
        <a class="brand" href="/" aria-label="TowaPC ホーム">
          <img
            class="custom-logo"
            src="/assets/TowaPC.svg"
            alt="TowaPC"
            width="485"
            height="100"
            fetchpriority="high"
          />
        </a>
        <div class="theme-switch" role="group" aria-label="表示テーマ">
          <span class="theme-selection" aria-hidden="true"></span>
          <button type="button" data-theme-option="light" aria-pressed="false">
            Light
          </button>
          <button type="button" data-theme-option="dark" aria-pressed="false">
            Dark
          </button>
        </div>
      </div>
      <div class="footer-groups">
        <section>
          <strong>Links</strong>
          <nav data-footer-links aria-label="サイト内リンク"></nav>
        </section>
        <section>
          <strong><a href="/contact/">Contact</a></strong>
          <nav data-footer-contact aria-label="公式リンクとお問い合わせ"></nav>
        </section>
      </div>
      <div class="footer-legal">
        <a href="/terms/">利用規約</a>
        <a href="/privacy/">プライバシーポリシー</a>
        <button type="button" data-cookie-settings>Cookie設定</button>
      </div>
      <small class="footer-copyright">
        © 2024〜2026 TowaPC. All rights reserved.
      </small>
    </footer>

    <button class="back-top" aria-label="ページの先頭へ">
      <span class="material-symbols-rounded" aria-hidden="true">
        arrow_upward
      </span>
    </button>
    <script type="module" src="/app-v2.js?v=73"></script>
  </body>
</html>
