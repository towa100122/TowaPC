ビスを安全かつ安定して提供するために必要な分析\n\n当団体は、取得した情報をユーザーのプライバシーを侵害する目的で利用することは一切ありません。\n\n\n\n## 第３条（Google Analytics）\n\n1. 当団体は、第２条に定める目的のため、Google LLCが提供するGoogle Analyticsを利用しています。\n2. Google Analyticsでは、Cookie等を利用して本サービスへのアクセスに関する情報が収集され、Google LLCへ送信されます。\n3. 収集される情報には、アクセス日時、閲覧ページ、参照元、デバイスに関する情報、Cookie等の識別子、おおよその地域情報などが含まれる場合があります。\n\nまた、Google シグナルによって、必要な設定や同意等の条件を満たすGoogleアカウントのユーザーについては、Google Analyticsで取得した情報とGoogleアカウントに関連する情報が関連付けられる場合があります。\n\n4. Googleによる情報の取扱いやGoogle Analyticsの仕組みについては、以下をご確認ください。\n\n[Google プライバシーポリシー](https://policies.google.com/privacy)\n\n[Googleのサービスを使用するサイトやアプリから収集した情報のGoogleによる使用](https://policies.google.com/technologies/partner-sites)\n\n\n\n5. Google Analyticsによるデータ収集を希望しない場合は、本サービスのCookie設定やブラウザの設定からCookieの使用を拒否できます。\n\nまた、Googleが提供する「Google Analytics オプトアウト アドオン」を利用することでも、Google Analyticsによるデータ収集を無効にできます。\n\n[Google Analytics オプトアウト アドオン](https://tools.google.com/dlpage/gaoptout/)\n\n\n\n## 第４条（Cookie）\n\n1. 本サービスでは、サイトの利用状況を把握し、サービスを改善するためにCookieを使用しています。\n\nCookieは、ユーザーのブラウザに保存される小さなデータです。\n\n2. ユーザーは、本サービスに表示されるCookieの設定やブラウザの設定から、Cookieの使用を拒否または変更できます。\n3. Cookieを拒否した場合、一部の機能やアクセス解析が利用されなくなるほか、本サービスの一部が正常に動作しなくなる場合があります。\n\n\n\n## 第５条（データの保存）\n\n1. Google Analyticsを通じて収集した対象データは、１４か月間保存されます。\n2. 保存期間を経過した対象データは、Google Analyticsの仕組みに従って削除されます。\n3. なお、Googleが独自に取り扱う情報や集計されたデータなどについては、Googleが定めるプライバシーポリシーやデータ保持に関する方針が適用される場合があります。\n\n\n\n## 第６条（第三者への提供および外部サービスへの送信）\n\n1. 当団体は、法令に基づく場合などを除き、ユーザーの個人情報を本人の同意なく第三者へ提供しません。\n2. ただし、本サービスでは、サービスの提供や改善に必要な範囲で外部サービスを利用する場合があります。\n3. 現在、本サービスではアクセス解析のためGoogle Analyticsを利用しており、本ポリシーに記載しているアクセス情報等がGoogle LLCへ送信されます。\n4. 当団体が取得したユーザーの情報を、利用目的と関係なく第三者へ販売することはありません。\n5. 新たな外部サービスの導入などによって情報の取扱いに重要な変更が発生する場合は、本ポリシーを更新します。\n\n\n\n## 第７条（安全対策）\n\n1. 当団体は、取得した情報の漏えい、紛失、不正アクセス、改ざんなどを防ぐため、必要な安全対策を行います。\n2. 通信の暗号化、利用するサービスやシステムの適切な設定、アクセスできる範囲の管理などを行い、必要のない情報をむやみに収集しないようにします。\n3. 万が一、ユーザーに重大な影響を与える可能性のある情報漏えいなどが発生した場合は、状況を確認したうえで必要な対応を行い、必要に応じて本サービスなどを通じてユーザーへお知らせします。\n\n\n\n## 第８条（情報の開示・訂正・削除等）\n\nユーザーは、当団体が保有しているユーザー自身の情報について、法令に基づき、開示、訂正、追加、削除、利用停止等を求めることができます。\n\nこれらを希望する場合は、[Contactページ](/contact/)からお問い合わせください。\n\n当団体は、必要に応じて本人確認を行ったうえで、法令に従って対応します。\n\n本人確認ができない場合、当団体が対象となる情報を保有していない場合、法令上対応する必要がない場合、その他対応が困難な正当な理由がある場合には、ご希望に対応できないことがあります。その場合は、可能な範囲でその理由をお知らせします。\n\n\n\n## 第９条（収集の拒否）\n\n1. ユーザーは、本サービスのCookie設定やブラウザの設定を利用して、CookieやGoogle Analyticsによる情報の収集を拒否できます。\n2. Cookie等の利用を拒否したことを理由として、本サービスの通常の閲覧を不当に制限することはありません。\n3. ただし、Cookie等を必要とする一部の機能については、正常に利用できなくなる場合があります。\n\n\n\n## 第１０条（本ポリシーの変更）\n\n1. 当団体は、本サービスの内容、使用する外部サービス、法令その他の事情の変更に応じて、本ポリシーを変更することがあります。\n2. 重要な変更を行う場合は、本サービス内やTowaPC Community（当団体が運営するDiscordサーバー）などで確実にお知らせを行います。\n3. 変更後の本ポリシーは、当団体が別途定める場合を除き、本サービス内に掲載された時点から適用されます。\n\n\n\n## 第１１条（お問い合わせ）\n\n本ポリシーに関するお問い合わせ、またはユーザー自身の情報についての開示・訂正・削除等に関するお問い合わせは、以下からご確認いただけます。\n\n[Contactページ](/contact/)\n\n\n\n以上\n\n"},"attachmentMeta":{}}
