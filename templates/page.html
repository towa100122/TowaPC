<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5e6ac" data-theme-color />
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TowaPC" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:image" content="https://towapc.com/assets/TowaPC.svg" />
    <title>{{TITLE}}</title>

    <script>
      /*__THEME_BOOTSTRAP__*/
    </script>
    <style>
      html {
        color-scheme: light;
      }
      html,
      body {
        background: #f5f5f2;
        color: #242822;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #10120f;
        color: #f1f3ed;
        color-scheme: dark;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap"
    />
    <link rel="stylesheet" href="/styles/foundation.css?v={{ASSET_VERSION}}" />
    <link rel="stylesheet" href="/styles/home.css?v={{ASSET_VERSION}}" />
    <link rel="stylesheet" href="/styles/content.css?v={{ASSET_VERSION}}" />
    <link rel="stylesheet" href="/styles/footer.css?v={{ASSET_VERSION}}" />
    <link rel="stylesheet" href="/styles/responsive.css?v={{ASSET_VERSION}}" />
    <link rel="stylesheet" href="/styles/dark-motion.css?v={{ASSET_VERSION}}" />
    <link
      rel="stylesheet"
      href="/styles/legal-cookie.css?v={{ASSET_VERSION}}"
    />
    <link
      rel="stylesheet"
      href="/styles/appearance-lab.css?v={{ASSET_VERSION}}"
    />
    <link rel="stylesheet" href="/styles/ui-polish.css?v={{ASSET_VERSION}}" />
    <link
      rel="stylesheet"
      href="/styles/material-theme.css?v={{ASSET_VERSION}}"
    />
    <link rel="stylesheet" href="/styles/features.css?v={{ASSET_VERSION}}" />
    <link
      rel="stylesheet"
      href="/styles/shadowless-theme.css?v={{ASSET_VERSION}}"
    />
    <link
      rel="stylesheet"
      href="/styles/monochrome-theme.css?v={{ASSET_VERSION}}"
    />
    <link rel="stylesheet" href="/styles/easter-eggs.css?v={{ASSET_VERSION}}" />

    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <link
      rel="preload"
      href="/assets/TowaPC.svg"
      as="image"
      type="image/svg+xml"
    />
    <script src="/analytics.js"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="/" aria-label="TowaPC ホーム">
        <img
          class="custom-logo"
          src="/assets/TowaPC.svg"
          alt="TowaPC"
          width="485"
          height="100"
          fetchpriority="high"
        />
      </a>
      <button
        class="menu-button"
        aria-label="メニューを開く"
        aria-expanded="false"
      >
        <span class="menu-glyph" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <nav aria-label="メインナビゲーション">{{HEADER_NAV}}</nav>
    </header>

    <main id="main">{{MAIN}}</main>

    <footer>
      <div class="footer-brand">
        <a class="brand" href="/" aria-label="TowaPC ホーム">
          <img
            class="custom-logo"
            src="/assets/TowaPC.svg"
            alt="TowaPC"
            width="485"
            height="100"
            fetchpriority="high"
          />
        </a>
        <div class="theme-switch" role="group" aria-label="表示テーマ">
          <span class="theme-selection" aria-hidden="true"></span>
          <button type="button" data-theme-option="light" aria-pressed="false">
            Light
          </button>
          <button type="button" data-theme-option="dark" aria-pressed="false">
            Dark
          </button>
        </div>
      </div>
      <div class="footer-groups">
        <section>
          <strong>Links</strong>
          <nav data-footer-links aria-label="サイト内リンク">
            {{FOOTER_LINKS}}
          </nav>
        </section>
        <section>
          <strong><a href="/contact/">Contact</a></strong>
          <nav data-footer-contact aria-label="公式リンクとお問い合わせ">
            {{FOOTER_CONTACTS}}
          </nav>
        </section>
      </div>
      <div class="footer-legal">
        <a href="/terms/">利用規約</a>
        <a href="/privacy/">プライバシーポリシー</a>
        <button type="button" data-cookie-settings>Cookie設定</button>
      </div>
      <small class="footer-copyright">
        © 2024〜2026 TowaPC. All rights reserved.
      </small>
    </footer>

    <button class="back-top" aria-label="ページの先頭へ">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 5-7 7 1.4 1.4 4.6-4.6V20h2V8.8l4.6 4.6L19 12z" />
      </svg>
    </button>
    <script id="site-data" type="application/json">
      {{SITE_DATA}}
    </script>
    <script
      type="module"
      src="/generated/app-bundle.js?v={{ASSET_VERSION}}"
    ></script>
  </body>
</html>
